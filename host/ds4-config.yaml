# Site configuration for the DS4 vLLM cluster.
# Deployed as ~/ds4-config.yaml on box1 (the ray head); the cluster scripts
# read it via `eval "$("$HOME/ds4-config")"`. Flat key: value only -- parsed
# by ds4-config with the Python stdlib, no pyyaml.
model: deepseek-ai/DeepSeek-V4-Flash-0731   # HF id (auto-downloaded to the HF cache) or a local path; weights needed on BOTH boxes. For image input point this at deepseek-ai/DeepSeek-V4-Flash-Vision-Exp instead -- the launcher detects a vision checkpoint (README "Vision")
transport: odl         # odl | tcp -- which ds4-cluster-env.<transport>.sh the cluster sources; odl is the fabric, tcp is the fallback for bring-up debugging
head_ip: 192.168.100.1
worker_ip: 192.168.100.2
container: vllm        # podman container name (same on both boxes)
control_iface_head: thunderbolt0    # NCCL/GLOO bootstrap-socket interface per box; may differ per host
control_iface_worker: thunderbolt0
odl_rank1_ip: 192.168.100.2         # odl transport only: rank-1 rendezvous address for odl_ar2 (usually = worker_ip)
api_port: 1234
disk_kv: true          # NVMe prefix-KV tier (fs_lru); prefixes survive restarts
disk_kv_gib: 30        # per-NODE disk cap; check df on BOTH boxes before raising
max_ctx: 524288        # --max-model-len (512K, the validated profile)
kv_pin_gib: 6          # pinned GPU KV pool; sized against MemAvailable, not grown by max_ctx
gpu_mem_util: 0.83     # vLLM --gpu-memory-utilization; IGNORED while the KV pin above is set
warmup_ctx: 2048       # post-start warmup prefill size (JIT kernels + bf16 weight cache + first prefill-indexer buckets; deeper buckets are cheap on first use); 0 disables
# Exactly ONE Thunderbolt cable between the boxes: OdinLink demuxes peers by
# route, and a second cable puts both links at the same route (see odinlink/README.md).
